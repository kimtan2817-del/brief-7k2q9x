name: Update and publish Global Brief

on:
  schedule:
    - cron: "7 * * * *"          # every hour (GitHub may start it a few minutes late)
    - cron: "0,30 22,23 * * *"   # 3:30, 4:00, 4:30 and 5:00 AM India time, so the page is fresh for early readers
    - cron: "0 0 * * *"          # 5:30 AM India time
  workflow_dispatch:             # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the page (fails, and so keeps the old page, if nothing could be fetched)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional: without it, cards are filled with trimmed article text
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
