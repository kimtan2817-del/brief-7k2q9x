name: Update and publish Global Brief

on:
  schedule:
    - cron: "7 * * * *"          # every hour (GitHub may start it a few minutes late)
    - cron: "0,30 22,23 * * *"   # 3:30, 4:00, 4:30 and 5:00 AM India time, so the page is fresh for early readers
    - cron: "0 0 * * *"          # 5:30 AM India time
  workflow_dispatch:         # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the page (fails, and so keeps the old page, if nothing could be fetched)
        run: python build.py
      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=site --prod --message "auto update"
